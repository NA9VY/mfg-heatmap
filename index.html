<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Manufacturing Employment — I-65/I-70 Corridor</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 20px; background: #f8f9fa; }
  h1 { font-size: 1.4rem; color: #1a1a1a; }
  #chart { width: 100%; height: 900px; }
  .note { color: #666; font-size: 0.9rem; margin-top: 10px; }
</style>
</head>
<body>
<h1>Manufacturing Employment by County<br><small>I-65 / I-70 Corridor (SE Indiana & SW Ohio) — illustrative values</small></h1>
<div id="chart"></div>
<p class="note">Blue = lower density, red = higher. Data is placeholder-style for planning; real County Business Patterns can be swapped in later. Sorted highest to lowest.</p>
<script>
const data = [
  {county: "Hamilton, OH", employees: 32000, corridor: "Cincinnati I-71/I-75/I-275"},
  {county: "Montgomery, OH", employees: 28000, corridor: "I-70/I-75 Dayton"},
  {county: "Marion, IN", employees: 18500, corridor: "I-65/I-70"},
  {county: "Butler, OH", employees: 16500, corridor: "I-75"},
  {county: "Bartholomew, IN", employees: 14500, corridor: "I-65"},
  {county: "Clark, OH", employees: 9800, corridor: "I-70"},
  {county: "Warren, OH", employees: 9800, corridor: "I-71/I-75"},
  {county: "Clark, IN", employees: 8900, corridor: "I-65"},
  {county: "Wayne, IN", employees: 7200, corridor: "I-70"},
  {county: "Greene, OH", employees: 6200, corridor: "I-70"},
  {county: "Johnson, IN", employees: 6200, corridor: "I-65"},
  {county: "Grant, IN", employees: 5400, corridor: "US-35"},
  {county: "Shelby, IN", employees: 4800, corridor: "I-65/I-70"},
  {county: "Hancock, IN", employees: 3500, corridor: "I-70"},
  {county: "Jackson, IN", employees: 3100, corridor: "I-65"},
  {county: "Henry, IN", employees: 2800, corridor: "I-70"},
  {county: "Preble, OH", employees: 2600, corridor: "I-70"},
  {county: "Clinton, OH", employees: 2400, corridor: "I-70/I-71"},
  {county: "Washington, IN", employees: 2200, corridor: "I-65"},
  {county: "Madison, OH", employees: 2100, corridor: "I-70"},
  {county: "Randolph, IN", employees: 2000, corridor: "I-69"},
  {county: "Scott, IN", employees: 1800, corridor: "I-65"},
  {county: "Harrison, IN", employees: 1500, corridor: "I-65"},
  {county: "Fayette, OH", employees: 1300, corridor: "I-70"},
  {county: "Rush, IN", employees: 1200, corridor: "I-70"},
  {county: "Fayette, IN", employees: 1100, corridor: "I-74"},
  {county: "Perry, IN", employees: 900, corridor: "I-65"},
  {county: "Union, IN", employees: 600, corridor: "I-74"},
  {county: "Crawford, IN", employees: 400, corridor: "I-65"}
];

data.sort((a, b) => b.employees - a.employees);

const trace = {
  type: "bar",
  orientation: "h",
  x: data.map(d => d.employees),
  y: data.map(d => d.county),
  marker: {
    color: data.map(d => d.employees),
    colorscale: [[0, "#08306b"], [0.3, "#6baed6"], [0.6, "#fee5d9"], [1, "#cb181d"]],
    showscale: true,
    colorbar: {title: "Employees"}
  },
  hovertemplate: "<b>%{y}</b><br>Mfg employees: %{x:,}<br>Corridor: %{customdata}<extra></extra>",
  customdata: data.map(d => d.corridor)
};

const layout = {
  title: "",
  margin: {l: 140, r: 40, t: 20, b: 40},
  xaxis: {title: "Manufacturing Employees"},
  yaxis: {autorange: "reversed"},
  paper_bgcolor: "white",
  plot_bgcolor: "#f8f9fa",
  height: 900
};

Plotly.newPlot("chart", [trace], layout, {responsive: true});
</script>
</body>
</html>
